<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKOIS</title>
<meta name="description" content="Aplicaciones para Android: rápidas, sin publicidad y sin recopilar datos.">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="envoltura">

  <span class="marca">SKOIS</span>
  <p class="lema">Aplicaciones para Android</p>

  <h1>Menos ruido.</h1>

  datos. Cada una hace una cosa y se aparta.</p>

  <h2 class="seccion" style="margin-top:56px">Aplicaciones</h2>
  <ul class="apps">
    <li>
      <a class="app" href="launcher/">
        <span class="app-icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"

            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
        </span>
        <span>
          <p class="app-nombre">SKOIS Launcher Minimalist</p>
          <p class="app-nota">Pantalla de inicio en negro puro</p>
        </span>
        <span class="flecha" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>

  <hr>
  <p class="pie">
    SKOIS · <a href="launcher/privacidad.html">Política de privacidad</a>
  <!-- PENDIENTE: correo de contacto. Play Console lo exige antes de
